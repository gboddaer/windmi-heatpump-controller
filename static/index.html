<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windmi Heat Pump Controller</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Windmi Heat Pump</h1>
            <div class="status-bar">
                <span id="deviceStatus" class="status-indicator offline">Offline</span>
                <button id="powerBtn" class="power-btn off">OFF</button>
            </div>
        </header>

        <nav class="tab-bar">
            <button class="tab-btn active" data-tab="overview">Overview</button>
            <button class="tab-btn" data-tab="schedule">Schedule</button>
            <button class="tab-btn" data-tab="diagnostics">Diagnostics</button>
        </nav>

        <main>
            <!-- Tab 1: Overview -->
            <div class="tab-panel active" id="tab-overview">
                <section class="status-card">
                    <h2>Current Status</h2>
                    <div class="status-row status-row-main">
                        <div class="status-item"><span class="label">Mode</span> <span id="modeValue" class="value">-</span></div>
                        <div class="status-item"><span class="label">Status</span> <span id="runStatus" class="value">-</span></div>
                        <div class="status-item"><span class="label">DHW</span> <span id="dhwDemandValue" class="value">-</span></div>
                        <div class="status-item"><span class="label">Outdoor</span> <span id="outdoorTempValue" class="value">-</span></div>
                    </div>
                </section>

                <section class="temps-card">
                    <h2>Temperatures</h2>
                    <div class="temp-grid">
                        <div class="temp-item">
                            <span class="label">DHW Tank</span>
                            <span id="dhwTempValue" class="value">-</span>
                        </div>
                        <div class="temp-item">
                            <span class="label">Heating (LWT)</span>
                            <span id="heatingTempValue" class="value">-</span>
                        </div>
                    </div>
                </section>

                <section class="controls-card">
                    <h2>Controls</h2>

                    <div class="control-group temp-controls-row">
                        <div class="temp-control-col">
                            <label for="dhwSlider">DHW (°C)</label>
                            <div class="temp-control-inline">
                                <input type="range" id="dhwSlider" min="40" max="63" step="0.5" value="50">
                                <input type="number" id="dhwInput" min="40" max="63" step="0.5" value="50">
                                <button id="setDhwBtn" class="btn btn-small">Set</button>
                            </div>
                        </div>
                        <div class="temp-control-col">
                            <label for="heatingSlider">Heating (°C)</label>
                            <div class="temp-control-inline">
                                <input type="range" id="heatingSlider" min="25" max="63" step="0.5" value="40">
                                <input type="number" id="heatingInput" min="25" max="63" step="0.5" value="40">
                                <button id="setHeatingBtn" class="btn btn-small">Set</button>
                            </div>
                        </div>
                    </div>

                    <div class="control-group mode-group">
                        <label>Working Mode</label>
                        <div class="mode-selector">
                            <button id="mode0Btn" class="mode-btn mode-off">OFF</button>
                            <button id="mode1Btn" class="mode-btn">DHW Only</button>
                            <button id="mode2Btn" class="mode-btn">Heating Only</button>
                            <button id="mode3Btn" class="mode-btn mode-active">Heating + DHW (DHW first)</button>
                        </div>
                    </div>

                    <div class="control-group occupancy-group">
                        <label>Occupancy Mode</label>
                        <div class="occupancy-selector">
                            <button id="occupancyAwayBtn" class="occupancy-btn">Away</button>
                            <button id="occupancySleepBtn" class="occupancy-btn">Sleep</button>
                            <button id="occupancyHomeBtn" class="occupancy-btn active">Home</button>
                        </div>
                    </div>
                </section>
            </div>

            <!-- Tab 2: Schedule -->
            <div class="tab-panel" id="tab-schedule">
                <section class="schedule-header">
                    <div class="schedule-toggle-row">
                        <h2>Schedule</h2>
                        <label class="toggle-switch">
                            <input type="checkbox" id="scheduleEnabled">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                    <div id="scheduleState" class="schedule-state"></div>
                </section>

                <section class="schedule-list">
                    <div id="scheduleRanges" class="schedule-ranges"></div>
                    <button id="addRangeBtn" class="btn btn-add-range">+ Add Time Range</button>
                </section>

                <!-- Edit dialog -->
                <div id="scheduleEditModal" class="modal-overlay">
                    <div class="modal-content">
                        <h3 id="editModalTitle">Edit Range</h3>
                        <div class="form-row">
                            <label>Start</label>
                            <input type="time" id="editStart" value="08:00">
                        </div>
                        <div class="form-row">
                            <label>End</label>
                            <input type="time" id="editEnd" value="10:00">
                        </div>
                        <div class="form-row">
                            <label>Mode</label>
                            <select id="editMode">
                                <option value="0">OFF</option>
                                <option value="1">DHW Only</option>
                                <option value="2">Heating Only</option>
                                <option value="3" selected>Heating + DHW</option>
                            </select>
                        </div>
                        <div class="form-row">
                            <label>Heating (°C)</label>
                            <input type="number" id="editHeatingTemp" min="25" max="63" step="0.5" value="40">
                        </div>
                        <div class="form-row">
                            <label>DHW (°C)</label>
                            <input type="number" id="editDhwTemp" min="40" max="63" step="0.5" value="45">
                        </div>
                        <div class="modal-actions">
                            <button id="editCancelBtn" class="btn btn-cancel">Cancel</button>
                            <button id="editSaveBtn" class="btn btn-save">Save</button>
                            <button id="editDeleteBtn" class="btn btn-delete">Delete</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tab 3: Diagnostics -->
            <div class="tab-panel" id="tab-diagnostics">
                <section class="status-card">
                    <h2>Diagnostics</h2>
                    <div class="temp-grid">
                        <div class="temp-item">
                            <span class="label">DHW Valve</span>
                            <span id="dhwValveValue" class="value">-</span>
                        </div>
                        <div class="temp-item">
                            <span class="label">DHW Mode</span>
                            <span id="dhwModeValue" class="value">-</span>
                        </div>
                        <div class="temp-item">
                            <span class="label">Capacity Output</span>
                            <span id="actualCapacityValue" class="value">-</span>
                        </div>
                    </div>
                </section>
            </div>
        </main>

        <footer>
            <p>Auto-refresh: <span id="refreshCountdown">5</span>s</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
